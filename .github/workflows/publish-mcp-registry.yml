name: publish MCP registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify the public remote before publication
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error --retry 3 \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            https://law.soufien.lu/mcp)

          # The official Streamable HTTP SDK returns a standards-compliant SSE frame. Keep the
          # check tolerant of a plain JSON response too so a future negotiated transport change
          # cannot turn a healthy endpoint into a false publication failure.
          if printf '%s' "$body" | jq -e '.result.tools | length == 10' >/dev/null 2>&1; then
            :
          else
            printf '%s\n' "$body" \
              | sed -n 's/^data: //p' \
              | jq -se '(map(select(.result.tools)) | last | .result.tools | length) == 10' >/dev/null
          fi

      - name: Install the official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish the remote server metadata
        shell: bash
        run: |
          set -euo pipefail
          if output=$(./mcp-publisher publish 2>&1); then
            printf '%s\n' "$output"
          elif grep -Fq 'invalid version: cannot publish duplicate version' <<<"$output"; then
            # workflow_dispatch is deliberately retryable. The registry makes versions
            # immutable, so an already-published identical version is the desired state.
            printf '%s\n' "$output"
            echo 'This immutable metadata version is already published.'
          else
            printf '%s\n' "$output" >&2
            exit 1
          fi
