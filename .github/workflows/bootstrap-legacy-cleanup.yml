name: bootstrap-legacy-cleanup

on:
  workflow_dispatch:
    inputs:
      inventory_run_id:
        description: Successful bootstrap-legacy-inventory run for this exact commit
        required: true
        type: string
      cleanup_plan_sha256:
        description: Independently reviewed SHA-256 of cleanup_plan.json
        required: true
        type: string
      recovery_plan_sha256:
        description: Reviewed no-write A+2 deploy-handoff plan SHA-256; leave empty for ordinary cleanup
        required: false
        default: ''
        type: string
      confirmation:
        description: Enter the exact ordinary-cleanup or no-write A+2-handoff confirmation
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: lex-production
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: rg-platform
      CONTAINER_APP: ca-lex-web
      INVENTORY_RUN_ID: ${{ inputs.inventory_run_id }}
      CLEANUP_PLAN_SHA256: ${{ inputs.cleanup_plan_sha256 }}
      RECOVERY_PLAN_SHA256: ${{ inputs.recovery_plan_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require exact reviewed one-time authority
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -eu
          [[ "$INVENTORY_RUN_ID" =~ ^[1-9][0-9]*$ ]] \
            && [[ "$CLEANUP_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::review coordinates are invalid"; exit 2; }
          if [ -n "$RECOVERY_PLAN_SHA256" ]; then
            [ "$CONFIRMATION" = "handoff-reviewed-inactive-for-first-official" ] \
              && [[ "$RECOVERY_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] \
              || { echo "::error::exact reviewed A+2 deploy-handoff authority is required"; exit 2; }
          else
            [ "$CONFIRMATION" = "purge-legacy-inactive-for-first-official" ] \
              || { echo "::error::exact first-release cleanup confirmation is required"; exit 2; }
          fi

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Re-read exact inventory, then perform only the reviewed operation or handoff
        id: cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          . scripts/deploy/az-retry.sh
          . scripts/deploy/az-reauth.sh
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INVENTORY_RUN_ID")
          [ "$(printf '%s' "$run" | jq -r .conclusion)" = "success" ] \
            && [ "$(printf '%s' "$run" | jq -r .event)" = "workflow_dispatch" ] \
            && [ "$(printf '%s' "$run" | jq -r .head_sha)" = "$GITHUB_SHA" ] \
            && [ "$(printf '%s' "$run" | jq -r .name)" = "bootstrap-legacy-inventory" ] \
            || { echo "::error::legacy inventory is not a successful exact-commit dry run"; exit 2; }
          mkdir plan
          gh run download "$INVENTORY_RUN_ID" \
            --name lex-bootstrap-legacy-cleanup-plan --dir plan
          [ "$(sha256sum plan/cleanup_plan.json | cut -d' ' -f1)" = "$CLEANUP_PLAN_SHA256" ] \
            || { echo "::error::reviewed cleanup plan SHA-256 differs"; exit 2; }
          if [ -n "$RECOVERY_PLAN_SHA256" ]; then
            [ -f plan/recovery_plan.json ] \
              && [ -f plan/bootstrap-legacy-recovery-inventory.json ] \
              && [ "$(sha256sum plan/recovery_plan.json | cut -d' ' -f1)" = "$RECOVERY_PLAN_SHA256" ] \
              || { echo "::error::reviewed A+2 deploy-handoff plan SHA-256 differs"; exit 2; }
          fi

          fresh_inventory() {
            local prefix="$1" limit
            az_reauth
            limit=$(az_retry az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --query properties.configuration.maxInactiveRevisions -o tsv)
            az_retry az containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --all -o json \
              | jq '[.[] | {name:.name,active:.properties.active,
                  trafficWeight:(.properties.trafficWeight // 0),
                  createdTime:.properties.createdTime,
                  image:.properties.template.containers[0].image,
                  template:.properties.template}]' > "$prefix-revisions.json"
            jq -n --argjson limit "$limit" --slurpfile revisions "$prefix-revisions.json" \
              '{schema:"lex-bootstrap-legacy-inventory/1",
                max_inactive_revisions:$limit,revisions:$revisions[0]}' \
              > "$prefix-inventory.json"
            python3 scripts/deploy/bootstrap_legacy_plan.py "$prefix-inventory.json" \
              > "$prefix-plan.json"
          }

          capture_recovery_inventory() {
            local prefix="$1"
            shift
            rm -f "$prefix-config.json" "$prefix-revisions.json" "$prefix-inventory.json"
            "$@" containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --query '{activeRevisionsMode:properties.configuration.activeRevisionsMode,
                maxInactiveRevisions:properties.configuration.maxInactiveRevisions,
                ingressTraffic:properties.configuration.ingress.traffic,
                latestRevisionName:properties.latestRevisionName,
                latestReadyRevisionName:properties.latestReadyRevisionName}' -o json \
              > "$prefix-config.json" || return 1
            "$@" containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --all -o json \
              | jq '[.[] | {name:.name,active:.properties.active,
                  trafficWeight:(.properties.trafficWeight // 0),
                  runningState:(.properties.runningState // null),
                  createdTime:.properties.createdTime,
                  image:.properties.template.containers[0].image,
                  template:.properties.template}]' > "$prefix-revisions.json" || return 1
            jq -n --slurpfile config "$prefix-config.json" \
              --slurpfile revisions "$prefix-revisions.json" \
              '{schema:"lex-bootstrap-legacy-recovery-inventory/2",
                active_revisions_mode:$config[0].activeRevisionsMode,
                max_inactive_revisions:$config[0].maxInactiveRevisions,
                latest_revision_name:$config[0].latestRevisionName,
                latest_ready_revision_name:$config[0].latestReadyRevisionName,
                ingress_traffic:(($config[0].ingressTraffic // []) | map({
                  revisionName:.revisionName,weight:.weight,
                  latestRevision:(.latestRevision // false),label:(.label // null)})),
                revisions:$revisions[0]}' > "$prefix-inventory.json" || return 1
          }

          fresh_recovery_inventory() {
            az_reauth || return 1
            capture_recovery_inventory "$1" az_retry az
          }

          is_reviewed_post_subset() {
            local candidate_plan="$1"
            jq -e --slurpfile after "$candidate_plan" '
                .legacy_authority == $after[0].legacy_authority
                and ($after[0].revisions | length) == 2
                and ([ $after[0].revisions[] as $item
                      | any(.revisions[]; . == $item) ] | all)
                and $after[0].mutation.max_inactive_revisions == 1' \
              plan/cleanup_plan.json >/dev/null
          }

          write_receipt() {
            local post_plan="$1" survivor="$2" post_sha authority survivor_identity
            post_sha=$(sha256sum "$post_plan" | cut -d' ' -f1)
            authority=$(jq -c .legacy_authority "$post_plan")
            survivor_identity=$(jq -ce --arg survivor "$survivor" \
              '.revisions[] | select(.revision == $survivor and .active == false
                and .traffic_weight == 0)' "$post_plan")
            jq -n --arg schema lex-bootstrap-legacy-cleanup-receipt/2 \
              --arg commit "$GITHUB_SHA" --arg plan "$CLEANUP_PLAN_SHA256" \
              --arg recovery "$RECOVERY_PLAN_SHA256" --arg post "$post_sha" \
              --arg survivor "$survivor" --argjson authority "$authority" \
              --argjson survivor_identity "$survivor_identity" \
              '{schema:$schema,code_commit:$commit,cleanup_plan_sha256:$plan,
                recovery_plan_sha256:($recovery | if length == 0 then null else . end),
                post_plan_sha256:$post,remaining_inactive_revision:$survivor,
                reviewed_inventory_sha256:null,max_inactive_revisions:1,
                legacy_authority:$authority,first_pruned_inactive_revision:null,
                handoff_latest_revision:null,handoff_latest_ready_revision:null,
                inactive_handoff:{first_pruned_inactive:null,
                  retained_until_candidate:$survivor_identity}}' \
              > bootstrap-legacy-cleanup-receipt.json
          }

          if [ -n "$RECOVERY_PLAN_SHA256" ]; then
            fresh_recovery_inventory immediate-recovery
            python3 scripts/deploy/bootstrap_legacy_recovery_plan.py \
              immediate-recovery-inventory.json > immediate-recovery-plan.json
            cmp --silent plan/recovery_plan.json immediate-recovery-plan.json \
              || { echo "::error::live A+2 deploy handoff differs from review"; exit 2; }
            jq -e --slurpfile cleanup plan/cleanup_plan.json '
                .operation == {
                  method:"NONE",traffic_change:false,activation_change:false,
                  template_change:false,configuration_change:false
                }
                and .legacy_authority == $cleanup[0].legacy_authority
                and (.handoff.first_pruned_inactive.active == false)
                and (.handoff.first_pruned_inactive.traffic_weight == 0)
                and (.handoff.retained_until_candidate.active == false)
                and (.handoff.retained_until_candidate.traffic_weight == 0)
                and .handoff.first_pruned_inactive.revision
                    != .handoff.retained_until_candidate.revision' \
              plan/recovery_plan.json >/dev/null \
              || { echo "::error::reviewed deploy handoff is not exact and mutation-free"; exit 2; }
            jq -n --arg schema lex-bootstrap-legacy-cleanup-receipt/2 \
              --arg commit "$GITHUB_SHA" --arg cleanup "$CLEANUP_PLAN_SHA256" \
              --arg recovery "$RECOVERY_PLAN_SHA256" \
              --slurpfile handoff plan/recovery_plan.json '
                $handoff[0] as $plan
                | {schema:$schema,code_commit:$commit,
                   cleanup_plan_sha256:$cleanup,recovery_plan_sha256:$recovery,
                   post_plan_sha256:null,
                   reviewed_inventory_sha256:$plan.inventory_sha256,
                   max_inactive_revisions:1,legacy_authority:$plan.legacy_authority,
                   first_pruned_inactive_revision:
                     $plan.handoff.first_pruned_inactive.revision,
                   remaining_inactive_revision:
                     $plan.handoff.retained_until_candidate.revision,
                   handoff_latest_revision:$plan.latest_revision_name,
                   handoff_latest_ready_revision:$plan.latest_ready_revision_name,
                   inactive_handoff:$plan.handoff}' \
              > bootstrap-legacy-cleanup-receipt.json
            echo "outcome=handoff" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fresh_inventory immediate
          cleanup_pending=true
          if cmp --silent plan/cleanup_plan.json immediate-plan.json; then
            :
          elif is_reviewed_post_subset immediate-plan.json; then
            cleanup_pending=false
            echo "cleanup already converged to an exact reviewed subset"
          else
            echo "::error::live revisions changed after the reviewed dry run"
            exit 2
          fi
          # The reviewed run id, plan digest and literal confirmation are durable workflow inputs.
          # If cancellation follows Azure acceptance, a fresh inventory can safely re-authorize
          # the same idempotent max=1 write; no traffic or activation recovery is required.
          if [ "$cleanup_pending" = "true" ]; then
            app_id=$(az_retry az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --query id -o tsv)
            body=$(jq -cn '{properties:{configuration:{maxInactiveRevisions:1}}}')
            az_retry az rest --method patch --uri "$app_id?api-version=2025-01-01" \
              --headers 'Content-Type=application/json' --body "$body" --output none
          fi
          for attempt in $(seq 1 24); do
            observed=$(az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --query properties.configuration.maxInactiveRevisions -o tsv 2>/dev/null || true)
            [ "$observed" = "1" ] && break
            sleep 5
          done
          [ "$observed" = "1" ] \
            || { echo "::error::maxInactiveRevisions=1 did not converge"; exit 1; }

          fresh_inventory post
          is_reviewed_post_subset post-plan.json \
            || { echo "::error::post-cleanup identities are not an exact reviewed subset"; exit 1; }
          survivor=$(jq -er \
            '.revisions[] | select(.active == false and .traffic_weight == 0) | .revision' \
            post-plan.json)
          write_receipt post-plan.json "$survivor"
          echo "outcome=converged" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.cleanup.outputs.outcome == 'converged' || steps.cleanup.outputs.outcome == 'handoff'
        with:
          name: lex-bootstrap-legacy-cleanup-receipt
          path: bootstrap-legacy-cleanup-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup summary
        shell: bash
        run: |
          {
            echo "## One-time first-release legacy cleanup"
            echo
            echo "- reviewed plan: \`$CLEANUP_PLAN_SHA256\`"
            if [ -n "$RECOVERY_PLAN_SHA256" ]; then
              echo "- reviewed A+2 deploy-handoff plan: \`$RECOVERY_PLAN_SHA256\`"
              echo "- handoff outcome: \`${{ steps.cleanup.outputs.outcome }}\`"
              echo "- Azure mutations: \`false\`"
              echo "- exact inactive records handed to R/C lifecycle: \`2\`"
            fi
            echo "- maxInactiveRevisions: \`1\`"
            echo "- traffic or activation mutation: \`false\`"
            echo "- current A remained active at 100%: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse an unreviewed A+2 handoff outcome
        if: inputs.recovery_plan_sha256 != '' && steps.cleanup.outputs.outcome != 'handoff'
        shell: bash
        run: |
          echo "::error::the reviewed no-write A+2 deploy handoff was not emitted"
          exit 1
