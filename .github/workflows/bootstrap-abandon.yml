name: bootstrap-abandon

on:
  workflow_dispatch:
    inputs:
      inventory_run_id:
        description: Successful exact-main bootstrap-preparation-inventory run id
        required: true
        type: string
      plan_sha256:
        description: Independently reviewed preparation-abandon plan SHA-256
        required: true
        type: string
      confirmation:
        description: Enter abandon-reviewed-bootstrap-preparation
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: lex-production
  cancel-in-progress: false

jobs:
  abandon:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: rg-platform
      CONTAINER_APP: ca-lex-web
      INVENTORY_RUN_ID: ${{ inputs.inventory_run_id }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require exact reviewed abandonment authority
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -eu
          [[ "$INVENTORY_RUN_ID" =~ ^[1-9][0-9]*$ ]] \
            && [[ "$PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            && [ "$CONFIRMATION" = "abandon-reviewed-bootstrap-preparation" ] \
            || { echo "::error::exact reviewed bootstrap-abandon authority is required"; exit 2; }

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deactivate only the exact reviewed active-zero revision
        id: abandon
        shell: bash
        run: |
          set -Eeuo pipefail
          . scripts/deploy/az-retry.sh
          . scripts/deploy/az-reauth.sh
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INVENTORY_RUN_ID")
          [ "$(printf '%s' "$run" | jq -r .conclusion)" = "success" ] \
            && [ "$(printf '%s' "$run" | jq -r .event)" = "workflow_dispatch" ] \
            && [ "$(printf '%s' "$run" | jq -r .head_sha)" = "$GITHUB_SHA" ] \
            && [ "$(printf '%s' "$run" | jq -r .name)" = "bootstrap-preparation-inventory" ] \
            || { echo "::error::preparation inventory is not a successful exact-commit run"; exit 2; }
          mkdir reviewed
          gh run download "$INVENTORY_RUN_ID" \
            --name lex-bootstrap-preparation-abandon-plan --dir reviewed
          [ "$(sha256sum reviewed/bootstrap-preparation-abandon-plan.json | cut -d' ' -f1)" \
              = "$PLAN_SHA256" ] \
            || { echo "::error::reviewed preparation-abandon plan SHA-256 differs"; exit 2; }

          capture_inventory() {
            local prefix="$1"
            shift
            rm -f "$prefix-config.json" "$prefix-revisions.json" "$prefix-inventory.json"
            "$@" containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --query '{activeRevisionsMode:properties.configuration.activeRevisionsMode,
                maxInactiveRevisions:properties.configuration.maxInactiveRevisions,
                ingressTraffic:properties.configuration.ingress.traffic,
                latestRevisionName:properties.latestRevisionName,
                latestReadyRevisionName:properties.latestReadyRevisionName}' -o json \
              > "$prefix-config.json" || return 1
            "$@" containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
              --all -o json \
              | jq '[.[] | {name:.name,active:.properties.active,
                  trafficWeight:(.properties.trafficWeight // 0),
                  runningState:(.properties.runningState // null),
                  createdTime:.properties.createdTime,
                  image:.properties.template.containers[0].image,
                  template:.properties.template}]' > "$prefix-revisions.json" || return 1
            jq -n --slurpfile config "$prefix-config.json" \
              --slurpfile revisions "$prefix-revisions.json" \
              '{schema:"lex-bootstrap-preparation-inventory/2",
                active_revisions_mode:$config[0].activeRevisionsMode,
                max_inactive_revisions:$config[0].maxInactiveRevisions,
                latest_revision_name:$config[0].latestRevisionName,
                latest_ready_revision_name:$config[0].latestReadyRevisionName,
                ingress_traffic:(($config[0].ingressTraffic // []) | map({
                  revisionName:.revisionName,weight:.weight,
                  latestRevision:(.latestRevision // false),label:(.label // null)})),
                revisions:$revisions[0]}' > "$prefix-inventory.json" || return 1
          }

          az_reauth
          app_id=$(az_retry az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --query id -o tsv)
          token=$(az_retry az account get-access-token \
            --resource https://management.azure.com/ --query accessToken -o tsv)
          client_request_id=$(python3 -c 'import uuid; print(uuid.uuid4())')
          : > abandon-response-headers.txt
          : > abandon-response-body.json
          capture_inventory immediate az_retry az
          if python3 scripts/deploy/bootstrap_preparation_abandon_plan.py \
              immediate-inventory.json > immediate-plan.json 2> immediate-plan-error.txt \
              && cmp --silent reviewed/bootstrap-preparation-abandon-plan.json \
                immediate-plan.json; then
            entry_state='target-active'
          else
            python3 scripts/deploy/bootstrap_preparation_abandon_plan.py --classify \
              reviewed/bootstrap-preparation-abandon-plan.json immediate-inventory.json \
              > entry-state.json \
              || { echo "::error::live preparation differs from reviewed pre/post state"; exit 2; }
            entry_state=$(jq -er .state entry-state.json)
          fi
          target=$(jq -er .operation.revision reviewed/bootstrap-preparation-abandon-plan.json)
          command_attempted=false
          command_exit=0
          http_status=''
          response_request_id=''
          response_correlation_id=''
          response_body_sha=''
          if [ "$entry_state" = "target-active" ]; then
            command_attempted=true
            set +e
            http_status=$(printf 'header = "Authorization: Bearer %s"\n' "$token" \
              | curl --silent --show-error --request POST --config - \
                --connect-timeout 10 --max-time 60 \
                --header "x-ms-client-request-id: $client_request_id" \
                --header 'Content-Length: 0' \
                --dump-header abandon-response-headers.txt \
                --output abandon-response-body.json \
                --write-out '%{http_code}' \
                "https://management.azure.com${app_id}/revisions/$target/deactivate?api-version=2025-01-01")
            command_exit=$?
            set -e
            response_request_id=$(awk -F': *' '
              tolower($1) == "x-ms-request-id" {gsub("\\r", "", $2); value=$2}
              END {print value}' abandon-response-headers.txt)
            response_correlation_id=$(awk -F': *' '
              tolower($1) == "x-ms-correlation-request-id" {gsub("\\r", "", $2); value=$2}
              END {print value}' abandon-response-headers.txt)
            response_body_sha=$(sha256sum abandon-response-body.json | cut -d' ' -f1)
          elif [ "$entry_state" != "target-inactive" ]; then
            echo "::error::preparation classifier returned an unknown entry state"
            exit 2
          fi
          unset token

          outcome=inconclusive
          consecutive=0
          observations=0
          last_error=''
          for attempt in $(seq 1 60); do
            observations=$attempt
            if ! capture_inventory observed az 2> observed-read-error.txt; then
              consecutive=0
              last_error=$(cat observed-read-error.txt 2>/dev/null || true)
            elif ! python3 scripts/deploy/bootstrap_preparation_abandon_plan.py --classify \
                reviewed/bootstrap-preparation-abandon-plan.json observed-inventory.json \
                > observed-state.json 2> observed-classify-error.txt; then
              consecutive=0
              last_error=$(cat observed-classify-error.txt 2>/dev/null || true)
            elif [ "$(jq -er .state observed-state.json)" = "target-inactive" ]; then
              consecutive=$((consecutive + 1))
              last_error=''
              if [ "$consecutive" = "3" ]; then
                sleep 10
                observations=$((observations + 1))
                if ! capture_inventory final az 2> final-read-error.txt; then
                  last_error=$(cat final-read-error.txt 2>/dev/null || true)
                elif ! python3 scripts/deploy/bootstrap_preparation_abandon_plan.py --classify \
                    reviewed/bootstrap-preparation-abandon-plan.json final-inventory.json \
                    > final-state.json 2> final-classify-error.txt; then
                  last_error=$(cat final-classify-error.txt 2>/dev/null || true)
                elif [ "$(jq -er .state final-state.json)" = "target-inactive" ]; then
                  outcome=converged
                else
                  last_error='final preparation state was not target-inactive'
                fi
                break
              fi
            else
              consecutive=0
              last_error='target remains active after the exact deactivation request'
            fi
            [ "$attempt" = "60" ] || sleep 10
          done
          error_sha=''
          if [ -n "$last_error" ]; then
            error_sha=$(printf '%s' "$last_error" | sha256sum | cut -d' ' -f1)
          fi
          jq -n --arg schema lex-bootstrap-preparation-abandon-evidence/2 \
            --arg commit "$GITHUB_SHA" --arg plan "$PLAN_SHA256" --arg target "$target" \
            --arg entry "$entry_state" --arg outcome "$outcome" \
            --argjson attempted "$command_attempted" --argjson command_exit "$command_exit" \
            --arg client_request_id "$client_request_id" --arg http_status "$http_status" \
            --arg response_request_id "$response_request_id" \
            --arg response_correlation_id "$response_correlation_id" \
            --arg response_body_sha "$response_body_sha" \
            --argjson observations "$observations" --arg error_sha "$error_sha" \
            '{schema:$schema,code_commit:$commit,plan_sha256:$plan,target_revision:$target,
              entry_state:$entry,request:{method:"POST",retry:false,
                attempted:$attempted,x_ms_client_request_id:
                  (if $attempted then $client_request_id else null end)},
              response:{curl_exit_code:
                  (if $attempted then $command_exit else null end),
                http_status:($http_status | if length == 0 then null else . end),
                x_ms_request_id:($response_request_id | if length == 0 then null else . end),
                x_ms_correlation_request_id:
                  ($response_correlation_id | if length == 0 then null else . end),
                body_sha256:($response_body_sha | if length == 0 then null else . end)},
              outcome:$outcome,observation_count:$observations,
              last_observation_error_sha256:($error_sha | if length == 0 then null else . end)}' \
            > bootstrap-preparation-abandon-evidence.json
          if [ "$outcome" = "converged" ]; then
            jq -n --arg schema lex-bootstrap-preparation-abandon-receipt/2 \
              --arg commit "$GITHUB_SHA" --arg plan "$PLAN_SHA256" --arg target "$target" \
              --slurpfile reviewed reviewed/bootstrap-preparation-abandon-plan.json \
              '{schema:$schema,code_commit:$commit,plan_sha256:$plan,
                target_revision:$target,legacy_authority:$reviewed[0].legacy_authority,
                superseded_inactive:$reviewed[0].superseded_inactive,
                abandoned_target:$reviewed[0].target,
                terminal_state:"exact A100 plus inactive R"}' \
              > bootstrap-preparation-abandon-receipt.json
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.abandon.outputs.outcome != ''
        with:
          name: lex-bootstrap-preparation-abandon-evidence
          path: bootstrap-preparation-abandon-evidence.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.abandon.outputs.outcome == 'converged'
        with:
          name: lex-bootstrap-preparation-abandon-receipt
          path: bootstrap-preparation-abandon-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Abandonment summary
        shell: bash
        run: |
          {
            echo "## Reviewed bootstrap preparation abandoned"
            echo
            echo "- reviewed plan: \`$PLAN_SHA256\`"
            echo "- outcome: \`${{ steps.abandon.outputs.outcome }}\`"
            echo "- traffic/configuration/template mutation: \`false\`"
            echo "- next action: fresh legacy inventory and reviewed cleanup receipt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse an inconclusive abandonment
        if: steps.abandon.outputs.outcome != 'converged'
        shell: bash
        run: |
          echo "::error::exact active-zero abandonment did not converge"
          exit 1
