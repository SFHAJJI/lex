name: bootstrap-legacy-inventory

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lex-production
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: rg-platform
      CONTAINER_APP: ca-lex-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build exact first-release legacy cleanup plan without mutations
        id: plan
        shell: bash
        run: |
          set -Eeuo pipefail
          . scripts/deploy/az-retry.sh
          . scripts/deploy/az-reauth.sh
          az_reauth
          az_retry az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --query '{activeRevisionsMode:properties.configuration.activeRevisionsMode,
              maxInactiveRevisions:properties.configuration.maxInactiveRevisions,
              ingressTraffic:properties.configuration.ingress.traffic,
              latestRevisionName:properties.latestRevisionName,
              latestReadyRevisionName:properties.latestReadyRevisionName}' -o json \
            > app-config.json
          limit=$(jq -er '.maxInactiveRevisions | numbers' app-config.json)
          az_retry az containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --all -o json \
            | jq '[.[] | {name:.name,active:.properties.active,
                trafficWeight:(.properties.trafficWeight // 0),
                runningState:(.properties.runningState // null),
                createdTime:.properties.createdTime,
                image:.properties.template.containers[0].image,
                template:.properties.template}]' > revisions.json
          jq -n --argjson limit "$limit" --slurpfile revisions revisions.json \
            '{schema:"lex-bootstrap-legacy-inventory/1",
              max_inactive_revisions:$limit,revisions:$revisions[0]}' \
            > bootstrap-legacy-inventory.json
          python3 scripts/deploy/bootstrap_legacy_plan.py \
            bootstrap-legacy-inventory.json > cleanup_plan.json
          plan_sha=$(sha256sum cleanup_plan.json | cut -d' ' -f1)
          recovery_plan_sha=""
          revision_count=$(jq 'length' revisions.json)
          if [ "$limit" = "1" ] && [ "$revision_count" = "3" ]; then
            jq -n --slurpfile config app-config.json --slurpfile revisions revisions.json \
              '{schema:"lex-bootstrap-legacy-recovery-inventory/2",
                active_revisions_mode:$config[0].activeRevisionsMode,
                max_inactive_revisions:$config[0].maxInactiveRevisions,
                latest_revision_name:$config[0].latestRevisionName,
                latest_ready_revision_name:$config[0].latestReadyRevisionName,
                ingress_traffic:(($config[0].ingressTraffic // []) | map({
                  revisionName:.revisionName,weight:.weight,
                  latestRevision:(.latestRevision // false),label:(.label // null)})),
                revisions:$revisions[0]}' \
              > bootstrap-legacy-recovery-inventory.json
            python3 scripts/deploy/bootstrap_legacy_recovery_plan.py \
              bootstrap-legacy-recovery-inventory.json > recovery_plan.json
            recovery_plan_sha=$(sha256sum recovery_plan.json | cut -d' ' -f1)
          fi
          echo "plan_sha256=$plan_sha" >> "$GITHUB_OUTPUT"
          echo "recovery_plan_sha256=$recovery_plan_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## One-time first-release legacy cleanup dry run"
            echo
            echo "- cleanup plan SHA-256: \`$plan_sha\`"
            if [ -n "$recovery_plan_sha" ]; then
              echo "- A+2 deploy-handoff plan SHA-256: \`$recovery_plan_sha\`"
            else
              echo "- A+2 deploy-handoff plan: \`not applicable\`"
            fi
            echo "- mutations performed: \`false\`"
            echo
            echo '```json'
            cat cleanup_plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lex-bootstrap-legacy-cleanup-plan
          path: |
            bootstrap-legacy-inventory.json
            cleanup_plan.json
            bootstrap-legacy-recovery-inventory.json
            recovery_plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Record review coordinates
        shell: bash
        run: |
          echo "Review run \`$GITHUB_RUN_ID\`, cleanup plan \`${{ steps.plan.outputs.plan_sha256 }}\`, and any no-write A+2 deploy-handoff plan \`${{ steps.plan.outputs.recovery_plan_sha256 }}\` before exact-confirmation cleanup." >> "$GITHUB_STEP_SUMMARY"
