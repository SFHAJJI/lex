name: trusted-golden-diff

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  trusted-golden-diff:
    name: trusted-golden-diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate trusted event boundary
        shell: bash
        env:
          TRUSTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          TRUSTED_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          TRUSTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$TRUSTED_BASE_REF" != "main" ]]; then
            echo "trusted golden diff only accepts main as its base" >&2
            exit 1
          fi
          if [[ "$TRUSTED_BASE_REPOSITORY" != "$TRUSTED_REPOSITORY" ]]; then
            echo "trusted golden diff base repository does not match the event repository" >&2
            exit 1
          fi
      - name: Check out the exact trusted base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install trusted classifier dependencies
        shell: bash
        run: npm --prefix "$GITHUB_WORKSPACE/web" ci --ignore-scripts --no-audit --no-fund
      - name: Classify the detached candidate with trusted code
        # This is review evidence, never a merge, rebuild, signing, deploy, or
        # promotion gate. A rejected diff remains visible in this step's log.
        continue-on-error: true
        shell: bash
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base="$TRUSTED_BASE_SHA"
          head="$CANDIDATE_HEAD_SHA"
          pr="$PR_NUMBER"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "trusted golden diff requires a full base SHA" >&2
            exit 1
          fi
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "trusted golden diff requires a full head SHA" >&2
            exit 1
          fi
          if [[ ! "$pr" =~ ^[1-9][0-9]*$ ]]; then
            echo "trusted golden diff requires a numeric pull request number" >&2
            exit 1
          fi
          checked_out="$(git rev-parse --verify HEAD)"
          if [[ "$checked_out" != "$base" ]]; then
            echo "trusted base checkout does not match the event" >&2
            exit 1
          fi

          merge_ref="refs/remotes/pull/${pr}/merge"
          git fetch --no-tags --depth=2 origin \
            "+refs/pull/${pr}/merge:${merge_ref}"
          candidate="$(git rev-parse --verify "${merge_ref}^{commit}")"
          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "trusted golden diff requires a full candidate SHA" >&2
            exit 1
          fi
          candidate_record="$(git rev-list --parents -n 1 "$candidate")"
          read -r -a candidate_parts <<< "$candidate_record"
          if [[ "${#candidate_parts[@]}" -ne 3 ]]; then
            echo "candidate must have exactly two parents" >&2
            exit 1
          fi
          if [[ "${candidate_parts[0]}" != "$candidate" ]]; then
            echo "candidate parent record does not match the requested commit" >&2
            exit 1
          fi
          candidate_base="${candidate_parts[1]}"
          candidate_head="${candidate_parts[2]}"
          if [[ "$candidate_base" != "$base" ]]; then
            echo "candidate merge base does not match the event" >&2
            exit 1
          fi
          if [[ "$candidate_head" != "$head" ]]; then
            echo "candidate merge head does not match the event" >&2
            exit 1
          fi

          candidate_parent="$(mktemp -d)"
          candidate_dir="${candidate_parent}/candidate"
          trap 'git worktree remove --force "$candidate_dir" 2>/dev/null || true; rmdir "$candidate_parent" 2>/dev/null || true' EXIT
          git worktree add --detach "$candidate_dir" "$candidate"
          python3 "$GITHUB_WORKSPACE/scripts/golden_diff.py" \
            --repo "$candidate_dir" \
            --base "$base" \
            --event "$GITHUB_EVENT_PATH"
