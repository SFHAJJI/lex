name: dual-review

# Both machine co-owners authenticate as the same GitHub account, so GitHub's own
# review mechanism cannot represent them: an account cannot approve its own pull
# request, and requiring an approving review would deadlock the branch rather than
# harden it. This check moves the gate into a status context, which is evaluated on
# a result rather than on an actor identity.
#
# Truth lives in the tracking issue. The pull request body names its issue; that
# issue's owner:* and reviewer:* labels decide who must review. A verdict comment
# from the reviewer, bound to the exact head commit, satisfies the gate.
#
# There is deliberately no issue_comment trigger. Those workflows run from the
# default branch, which here is the frozen V2 fallback, and an issue_comment run is
# not a check on the pull request head in any case. The reviewer instead toggles the
# recheck label after posting a verdict, which re-runs this workflow against the head.
#
# This defends against forgetting, not against forgery. A shared account means either
# agent could write the other's marker; doing so would be a deliberate, timestamped,
# public falsification rather than the silent omission this exists to prevent.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [v3/integration]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  # The gate's own induced mutations. A gate that has never been shown red is a
  # name, not a gate, so these run on every change to it.
  dual-review-tests:
    name: dual-review-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  dual-review:
    name: dual-review
    needs: dual-review-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: verify a SHA-bound verdict from the declared reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/dual_review.py
