name: dual-review

# Both machine co-owners authenticate as the same GitHub account, so GitHub's own
# review mechanism cannot represent them: an account cannot approve its own pull
# request, and requiring an approving review would deadlock the branch rather than
# harden it.
#
# An earlier design read the verdict from pull request comments. Two holes closed it:
# arbitrary `owner:*` / `reviewer:*` label pairs false-passed, and comment truth is
# mutable without re-triggering a head workflow, so an edited or superseded verdict
# could stay green indefinitely.
#
# The verdict is now an immutable empty `lex-review/1` receipt commit at the pull
# request head, created by the non-writer after review. Its parent is the reviewed
# candidate, its tree must equal that parent's, and its message binds issue, writer,
# reviewer, candidate commit, candidate tree and verdict. Any later product commit
# makes the head cease to be a receipt and fails the gate until a fresh review.
#
# No comment is parsed for gate state. Comments remain public evidence only.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [v3/integration]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  # The gate's own induced mutations, including real temporary Git repositories. A
  # receipt gate tested only against hand-built tuples has not been tested against Git.
  dual-review-tests:
    name: dual-review-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  dual-review:
    name: dual-review
    needs: dual-review-tests
    runs-on: ubuntu-latest
    steps:
      # The pull request head explicitly, never the synthetic merge commit: the receipt
      # is a property of the head, and validating a merge would check a commit no
      # reviewer ever saw. Depth 2 so the parent is present for tree comparison.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: verify the immutable lex-review/1 receipt at the head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/dual_review.py
