name: ci

# Every guarantee this project makes is enforced by a test: the fitness rules that keep the
# layering honest, and the frozen-fingerprint tests that make "a published extraction profile
# never changes its output" true rather than aspirational. Until this file existed those tests
# only ran when someone typed `dotnet test`, while the nightly pipeline built from unpinned
# main — so a profile regression could rewrite tens of thousands of published hashes overnight
# with a green build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release --nologo
      - name: test (fitness rules + frozen profile fingerprints)
        run: dotnet test -c Release --nologo --logger "console;verbosity=normal"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci --no-audit --no-fund
        working-directory: web
      # Typechecks, bundles, and asserts in a real DOM that the workspace actually mounts —
      # a bundle can typecheck and serve correctly and still throw on its first line.
      - run: npm run build
        working-directory: web
      - run: dotnet build src/Lex.Web/Lex.Web.csproj -c Release --nologo
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: browser contracts and performance budgets
        run: npm run test:browser
        working-directory: web
