name: ci

# Every guarantee this project makes is enforced by a test: the fitness rules that keep the
# layering honest, and the frozen-fingerprint tests that make "a published extraction profile
# never changes its output" true rather than aspirational. Until this file existed those tests
# only ran when someone typed `dotnet test`, while the nightly pipeline built from unpinned
# main — so a profile regression could rewrite tens of thousands of published hashes overnight
# with a green build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400
      - name: verify exact SDK
        shell: bash
        run: test "$(dotnet --version)" = "10.0.400"
      - run: dotnet restore Lex.slnx --locked-mode --nologo
      - run: dotnet build -c Release --no-restore --nologo
      - name: test (fitness rules + frozen profile fingerprints)
        shell: bash
        run: |
          mkdir -p artifacts/test-results
          dotnet test tests/Lex.Tests/Lex.Tests.csproj -c Release --no-build --nologo \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=ci.trx" \
            --results-directory artifacts/test-results
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          counters = ET.parse("artifacts/test-results/ci.trx").getroot().find(
              ".//{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}Counters")
          if counters is None:
              sys.exit("CI test result has no execution counters")
          total = int(counters.attrib.get("total", "0"))
          executed = int(counters.attrib.get("executed", "0"))
          if total < 300 or executed < 300:
              sys.exit(f"CI executed only {executed} of {total} discovered tests; expected at least 300")
          print(f"verified {executed} executed tests ({total} discovered)")
          PY
      - name: golden baselines stay tracked and unchanged
        run: test -z "$(git status --porcelain --untracked-files=all -- tests/Lex.Tests/golden)"
      - name: deploy contract tests
        run: python3 -m unittest discover -s tests/deploy -p 'test_*.py'

  canon-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400
      - name: verify exact SDK
        shell: pwsh
        run: |
          if ((dotnet --version).Trim() -ne "10.0.400") {
            throw "canon/1 requires .NET SDK 10.0.400"
          }
      - name: canon/1 byte contract
        shell: pwsh
        run: |
          dotnet restore tests/Lex.Tests/Lex.Tests.csproj --locked-mode --nologo
          dotnet test tests/Lex.Tests/Lex.Tests.csproj -c Release --no-restore --nologo --filter FullyQualifiedName~Canon1FreezeTests
      - name: canon/2 byte contract
        shell: pwsh
        run: dotnet test tests/Lex.Tests/Lex.Tests.csproj -c Release --no-restore --nologo --filter FullyQualifiedName~Canon2FreezeTests
      - name: DirectML locked dependency graph
        shell: pwsh
        run: |
          dotnet restore Lex.slnx --locked-mode --nologo -p:UseDirectML=true
          dotnet build src/Lex.Ingest/Lex.Ingest.csproj -c Release --no-restore --nologo -p:UseDirectML=true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: tooling contract tests
        run: python3 -m unittest discover -s tests/tooling -p 'test_*.py'
      # Typechecks, bundles, and asserts in a real DOM that the workspace actually mounts —
      # a bundle can typecheck and serve correctly and still throw on its first line.
      - run: npm run build
        working-directory: web
      - run: dotnet restore src/Lex.Web/Lex.Web.csproj --locked-mode --nologo
      - run: dotnet build src/Lex.Web/Lex.Web.csproj -c Release --no-restore --nologo
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: browser contracts and performance budgets
        run: npm run test:browser
        working-directory: web
