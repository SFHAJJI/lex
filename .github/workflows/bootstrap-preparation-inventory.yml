name: bootstrap-preparation-inventory

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lex-production
  cancel-in-progress: false

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: rg-platform
      CONTAINER_APP: ca-lex-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build exact active-zero abandonment plan without mutations
        id: plan
        shell: bash
        run: |
          set -Eeuo pipefail
          . scripts/deploy/az-retry.sh
          . scripts/deploy/az-reauth.sh
          az_reauth
          az_retry az containerapp show -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --query '{activeRevisionsMode:properties.configuration.activeRevisionsMode,
              maxInactiveRevisions:properties.configuration.maxInactiveRevisions,
              ingressTraffic:properties.configuration.ingress.traffic,
              latestRevisionName:properties.latestRevisionName,
              latestReadyRevisionName:properties.latestReadyRevisionName}' -o json \
            > app-config.json
          az_retry az containerapp revision list -g "$RESOURCE_GROUP" -n "$CONTAINER_APP" \
            --all -o json \
            | jq '[.[] | {name:.name,active:.properties.active,
                trafficWeight:(.properties.trafficWeight // 0),
                runningState:(.properties.runningState // null),
                createdTime:.properties.createdTime,
                image:.properties.template.containers[0].image,
                template:.properties.template}]' > revisions.json
          jq -n --slurpfile config app-config.json --slurpfile revisions revisions.json \
            '{schema:"lex-bootstrap-preparation-inventory/1",
              active_revisions_mode:$config[0].activeRevisionsMode,
              max_inactive_revisions:$config[0].maxInactiveRevisions,
              latest_revision_name:$config[0].latestRevisionName,
              latest_ready_revision_name:$config[0].latestReadyRevisionName,
              ingress_traffic:(($config[0].ingressTraffic // []) | map({
                revisionName:.revisionName,weight:.weight,
                latestRevision:(.latestRevision // false),label:(.label // null)})),
              revisions:$revisions[0]}' > bootstrap-preparation-inventory.json
          python3 scripts/deploy/bootstrap_preparation_abandon_plan.py \
            bootstrap-preparation-inventory.json > bootstrap-preparation-abandon-plan.json
          plan_sha=$(sha256sum bootstrap-preparation-abandon-plan.json | cut -d' ' -f1)
          [[ "$plan_sha" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::preparation abandon plan digest is invalid"; exit 2; }
          echo "plan_sha256=$plan_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lex-bootstrap-preparation-abandon-plan
          path: |
            bootstrap-preparation-inventory.json
            bootstrap-preparation-abandon-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Record review coordinates
        shell: bash
        run: |
          {
            echo "## Read-only bootstrap preparation inventory"
            echo
            echo "- run: \`$GITHUB_RUN_ID\`"
            echo "- exact commit: \`$GITHUB_SHA\`"
            echo "- reviewed plan SHA-256: \`${{ steps.plan.outputs.plan_sha256 }}\`"
            echo "- target active-zero revision: \`$(jq -r .target.revision bootstrap-preparation-abandon-plan.json)\`"
            echo "- Azure mutations: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
