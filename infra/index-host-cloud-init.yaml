#cloud-config
package_update: true
packages:
  - docker.io
  - jq
  - sqlite3

write_files:
  - path: /usr/local/sbin/lex-mount-index-disk
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/sh
      set -eu
      device=/dev/disk/azure/scsi1/lun0
      attempt=0
      while [ ! -b "$device" ]; do
        attempt=$((attempt + 1))
        [ "$attempt" -le 120 ] || { echo "index data disk did not appear" >&2; exit 1; }
        sleep 1
      done
      if ! blkid "$device" >/dev/null 2>&1; then
        mkfs.ext4 -L lex-index "$device"
      fi
      mkdir -p /srv/lex
      uuid=$(blkid -s UUID -o value "$device")
      grep -q "UUID=$uuid " /etc/fstab || printf 'UUID=%s /srv/lex ext4 defaults,nofail 0 2\n' "$uuid" >> /etc/fstab
      mountpoint -q /srv/lex || mount /srv/lex
      mkdir -p /srv/lex/releases /srv/lex/runtime /srv/lex/caddy
      chown -R lexadmin:lexadmin /srv/lex

  - path: /etc/systemd/system/lex-index-disk.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Prepare the persistent Lex index disk
      After=dev-disk-azure-scsi1-lun0.device
      Wants=dev-disk-azure-scsi1-lun0.device

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/lex-mount-index-disk
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl enable --now docker
  - systemctl daemon-reload
  - systemctl enable --now lex-index-disk.service
