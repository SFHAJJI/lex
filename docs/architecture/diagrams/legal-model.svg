<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">Temporal legal model</title>
  <desc id="desc">A work contains dated consolidations, each consolidation contains language expressions and publisher manifestations. Legal time and observation time remain separate axes.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#59626c"/></marker></defs>
  <style>.b{fill:#fff;stroke:#9aa4ad;stroke-width:2}.w{fill:#eaf7f1;stroke:#0f6b4f}.v{fill:#fff8df;stroke:#a87713}.l{stroke:#59626c;stroke-width:2;fill:none;marker-end:url(#a)}text{font:15px system-ui,sans-serif;fill:#0f1419}.s{font-size:12px;fill:#59626c}.h{font-weight:700}@media(prefers-color-scheme:dark){.b{fill:#131920}.w{fill:#12271f}.v{fill:#2c2513}text{fill:#e6e9ec}.s{fill:#a7b0b9}}</style>
  <rect class="w" x="38" y="54" width="170" height="78" rx="10"/><text class="h" x="123" y="85" text-anchor="middle">Work</text><text class="s" x="123" y="109" text-anchor="middle">one instrument over life</text>
  <rect class="v" x="292" y="35" width="190" height="90" rx="10"/><text class="h" x="387" y="67" text-anchor="middle">Dated state A</text><text class="s" x="387" y="91" text-anchor="middle">valid interval [A, B)</text>
  <rect class="v" x="292" y="154" width="190" height="90" rx="10"/><text class="h" x="387" y="186" text-anchor="middle">Dated state B</text><text class="s" x="387" y="210" text-anchor="middle">stable publisher identity</text>
  <rect class="b" x="565" y="28" width="165" height="68" rx="10"/><text class="h" x="648" y="57" text-anchor="middle">Expression</text><text class="s" x="648" y="79" text-anchor="middle">French</text>
  <rect class="b" x="565" y="115" width="165" height="68" rx="10"/><text class="h" x="648" y="144" text-anchor="middle">Expression</text><text class="s" x="648" y="166" text-anchor="middle">English</text>
  <rect class="b" x="810" y="72" width="155" height="68" rx="10"/><text class="h" x="888" y="101" text-anchor="middle">Manifestation</text><text class="s" x="888" y="123" text-anchor="middle">XML, HTML or PDF</text>
  <path class="l" d="M208 92h84"/><path class="l" d="M208 101c45 0 32 98 84 98"/><path class="l" d="M482 73h83"/><path class="l" d="M482 86c43 0 35 63 83 63"/><path class="l" d="M730 62c42 0 35 44 80 44"/>
  <line x1="70" y1="310" x2="455" y2="310" stroke="#c6112f" stroke-width="3"/><circle cx="160" cy="310" r="7" fill="#c6112f"/><circle cx="365" cy="310" r="7" fill="#c6112f"/><text class="h" x="70" y="288">Legal or consolidation time</text><text class="s" x="70" y="339">Which publisher state covers the requested date?</text>
  <line x1="545" y1="310" x2="930" y2="310" stroke="#0f6b4f" stroke-width="3"/><circle cx="650" cy="310" r="7" fill="#0f6b4f"/><circle cx="842" cy="310" r="7" fill="#0f6b4f"/><text class="h" x="545" y="288">Observation time</text><text class="s" x="545" y="339">When did Lex first observe the record?</text>
</svg>
