<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Lex in three planes</title>
  <desc id="desc">A data plane runs nightly from publishers through an append-only corpus, gated derivation and an index build to signed artifacts. A release plane runs per release from an immutable image through a zero-traffic candidate and its gates to a signed evaluation and one promotion. A runtime plane runs per question from the reader through admission, subject preflight, planner, gate and freeze, executor and the legal core to a typed reply with an optional composer and judge. The planes meet at exactly two artifacts: the signed index and the signed evaluation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#59626c"/></marker></defs>
  <style>.box{fill:#fff;stroke:#9aa4ad;stroke-width:2}.data{fill:#fff8df;stroke:#a87713}.core{fill:#eaf7f1;stroke:#0f6b4f}.ai{fill:#f2edfa;stroke:#6b4ca5}.line{stroke:#59626c;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}text{font:14px system-ui,sans-serif;fill:#0f1419}.small{font-size:11px;fill:#59626c}.label{font-weight:700}.plane{font-size:12px;font-weight:700;fill:#59626c;letter-spacing:1px}@media(prefers-color-scheme:dark){.box{fill:#131920}.data{fill:#2c2513}.core{fill:#12271f}.ai{fill:#20192e}text{fill:#e6e9ec}.small{fill:#a7b0b9}.plane{fill:#a7b0b9}}</style>

  <text class="plane" x="24" y="30">DATA PLANE, NIGHTLY</text>
  <rect class="box" x="24" y="42" width="130" height="56" rx="9"/>
  <text class="label" x="89" y="66" text-anchor="middle">Legilux</text>
  <text class="label" x="89" y="84" text-anchor="middle">EUR-Lex</text>
  <path class="line" d="M154 70h44"/><text class="small" x="176" y="62" text-anchor="middle">bytes</text>
  <rect class="box" x="198" y="42" width="188" height="56" rx="9"/>
  <text class="label" x="292" y="66" text-anchor="middle">Append-only corpus</text>
  <text class="small" x="292" y="84" text-anchor="middle">observation records, events</text>
  <path class="line" d="M386 70h44"/>
  <rect class="box" x="430" y="42" width="180" height="56" rx="9"/>
  <text class="label" x="520" y="66" text-anchor="middle">Derive, gated</text>
  <text class="small" x="520" y="84" text-anchor="middle">frozen extraction profiles</text>
  <path class="line" d="M610 70h44"/>
  <rect class="box" x="654" y="42" width="180" height="56" rx="9"/>
  <text class="label" x="744" y="66" text-anchor="middle">Index build</text>
  <text class="small" x="744" y="84" text-anchor="middle">SQLite FTS5 + vectors</text>
  <path class="line" d="M834 70h44"/>
  <rect class="data" x="878" y="42" width="204" height="56" rx="9"/>
  <text class="label" x="980" y="66" text-anchor="middle">Signed artifacts</text>
  <text class="small" x="980" y="84" text-anchor="middle">manifest + signature</text>

  <text class="plane" x="24" y="152">RELEASE PLANE, PER RELEASE</text>
  <rect class="box" x="24" y="164" width="170" height="56" rx="9"/>
  <text class="label" x="109" y="188" text-anchor="middle">Immutable image</text>
  <text class="small" x="109" y="206" text-anchor="middle">code + verified indexes</text>
  <path class="line" d="M194 192h44"/>
  <rect class="box" x="238" y="164" width="180" height="56" rx="9"/>
  <text class="label" x="328" y="188" text-anchor="middle">Candidate at 0%</text>
  <text class="small" x="328" y="206" text-anchor="middle">deploy cannot promote</text>
  <path class="line" d="M418 192h44"/>
  <rect class="box" x="462" y="164" width="230" height="56" rx="9"/>
  <text class="label" x="577" y="184" text-anchor="middle">Gates</text>
  <text class="small" x="577" y="200" text-anchor="middle">readiness, injection canaries,</text>
  <text class="small" x="577" y="213" text-anchor="middle">load test</text>
  <path class="line" d="M692 192h44"/>
  <rect class="box" x="736" y="164" width="200" height="56" rx="9"/>
  <text class="label" x="836" y="184" text-anchor="middle">Signed evaluation</text>
  <text class="small" x="836" y="200" text-anchor="middle">25 cases x 48 repetitions,</text>
  <text class="small" x="836" y="213" text-anchor="middle">admission, separate grader</text>
  <path class="line" d="M936 192h44"/>
  <rect class="data" x="980" y="164" width="160" height="56" rx="9"/>
  <text class="label" x="1060" y="188" text-anchor="middle">Promote once</text>
  <text class="small" x="1060" y="206" text-anchor="middle">rollback retained</text>
  <path class="line dash" d="M980 98v34l-780 32"/>
  <text class="small" x="620" y="146" text-anchor="middle">verified artifacts baked into the image; a repo-only build answers no_corpus_mounted</text>

  <text class="plane" x="24" y="276">RUNTIME PLANE, PER QUESTION</text>
  <rect class="box" x="24" y="288" width="104" height="52" rx="9"/>
  <text class="label" x="76" y="318" text-anchor="middle">Reader</text>
  <path class="line" d="M128 314h38"/>
  <rect class="box" x="166" y="288" width="148" height="52" rx="9"/>
  <text class="label" x="240" y="310" text-anchor="middle">Admission</text>
  <text class="small" x="240" y="327" text-anchor="middle">quotas, idempotency</text>
  <path class="line" d="M314 314h38"/>
  <rect class="box" x="352" y="288" width="162" height="52" rx="9"/>
  <text class="label" x="433" y="310" text-anchor="middle">Subject preflight</text>
  <text class="small" x="433" y="327" text-anchor="middle">identity before any model</text>
  <path class="line" d="M514 314h38"/>
  <rect class="ai" x="552" y="288" width="130" height="52" rx="9"/>
  <text class="label" x="617" y="310" text-anchor="middle">Planner</text>
  <text class="small" x="617" y="327" text-anchor="middle">one typed plan</text>
  <path class="line" d="M682 314h38"/>
  <rect class="box" x="720" y="288" width="186" height="52" rx="9"/>
  <text class="label" x="813" y="306" text-anchor="middle">Gate + date guard</text>
  <text class="small" x="813" y="320" text-anchor="middle">correct once, then freeze:</text>
  <text class="small" x="813" y="333" text-anchor="middle">no observation, no replan</text>
  <path class="line" d="M906 314h38"/>
  <rect class="box" x="944" y="288" width="150" height="52" rx="9"/>
  <text class="label" x="1019" y="310" text-anchor="middle">Executor</text>
  <text class="small" x="1019" y="327" text-anchor="middle">sequential, in-process</text>

  <path class="line" d="M1019 340v40"/>
  <rect class="core" x="898" y="384" width="242" height="54" rx="9"/>
  <text class="label" x="1019" y="406" text-anchor="middle">Legal core + signed index</text>
  <text class="small" x="1019" y="424" text-anchor="middle">10 operations, 15 closed statuses</text>
  <path class="line" d="M896 411H642v20"/>
  <text class="small" x="762" y="403" text-anchor="middle">rows + hashes + permalinks, or a typed gap</text>
  <rect class="box" x="482" y="434" width="320" height="56" rx="9"/>
  <text class="label" x="642" y="454" text-anchor="middle">Outcome router + response contract</text>
  <text class="small" x="642" y="470" text-anchor="middle">closed effect slots, forced disclosures,</text>
  <text class="small" x="642" y="483" text-anchor="middle">evidence ledger 64 / 96,000</text>
  <path class="line dash" d="M480 462H240v-118"/>
  <text class="small" x="352" y="454" text-anchor="middle">typed reply, cards, citations</text>
  <path class="line dash" d="M642 490v28"/>
  <rect class="ai" x="482" y="522" width="320" height="50" rx="9" stroke-dasharray="7 5"/>
  <text class="label" x="642" y="542" text-anchor="middle">Optional: composer, then judge</text>
  <text class="small" x="642" y="559" text-anchor="middle">explicit ask only; Pass / Repair / Refuse; fallback keeps the typed reply</text>
</svg>
