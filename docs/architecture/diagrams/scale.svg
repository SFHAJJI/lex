<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
  <title id="title">Measured scaling path</title>
  <desc id="desc">Lex begins as one process with local signed artifacts. Queue pressure first narrows lock scope. Sustained latency externalizes state before replicas are added. Memory pressure moves artifacts to verified local disk. Each move is authorized by an observable trigger.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#59626c"/></marker></defs>
  <style>.b{fill:#fff;stroke:#9aa4ad;stroke-width:2}.g{fill:#eaf7f1;stroke:#0f6b4f}.y{fill:#fff8df;stroke:#a87713}.l{stroke:#59626c;stroke-width:2;fill:none;marker-end:url(#a)}text{font:14px system-ui,sans-serif;fill:#0f1419}.s{font-size:11.5px;fill:#59626c}.h{font-weight:700}@media(prefers-color-scheme:dark){.b{fill:#131920}.g{fill:#12271f}.y{fill:#2c2513}text{fill:#e6e9ec}.s{fill:#a7b0b9}}</style>
  <rect class="g" x="35" y="54" width="190" height="112" rx="10"/><text class="h" x="130" y="86" text-anchor="middle">Now: one process</text><text class="s" x="130" y="112" text-anchor="middle">local signed index</text><text class="s" x="130" y="134" text-anchor="middle">authoritative ledgers</text><text class="s" x="130" y="154" text-anchor="middle">one replica</text>
  <rect class="b" x="285" y="54" width="190" height="112" rx="10"/><text class="h" x="380" y="86" text-anchor="middle">Narrow gates</text><text class="s" x="380" y="112" text-anchor="middle">only encoder and vector</text><text class="s" x="380" y="134" text-anchor="middle">work stays serialized</text>
  <rect class="y" x="535" y="54" width="190" height="112" rx="10"/><text class="h" x="630" y="86" text-anchor="middle">Externalize state</text><text class="s" x="630" y="112" text-anchor="middle">quota + idempotency</text><text class="s" x="630" y="134" text-anchor="middle">thread registry</text>
  <rect class="b" x="785" y="54" width="250" height="112" rx="10"/><text class="h" x="910" y="86" text-anchor="middle">Replicas or VM-local disk</text><text class="s" x="910" y="112" text-anchor="middle">scale requests after shared state</text><text class="s" x="910" y="134" text-anchor="middle">move artifacts only after memory gate</text>
  <path class="l" d="M225 110h60"/><path class="l" d="M475 110h60"/><path class="l" d="M725 110h60"/>
  <text class="s" x="255" y="205" text-anchor="middle">queue deadline refusals</text><text class="s" x="505" y="205" text-anchor="middle">sustained latency</text><text class="s" x="755" y="205" text-anchor="middle">replica or memory trigger</text>
  <rect class="y" x="165" y="245" width="750" height="62" rx="10"/><text class="h" x="540" y="272" text-anchor="middle">No trigger authorizes a rewrite or premature service split.</text><text class="s" x="540" y="294" text-anchor="middle">The next architecture move is a measured response, not a fashion choice.</text>
</svg>
