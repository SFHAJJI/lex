<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">Assistant conversation memory boundary</title>
  <desc id="desc">The browser component holds a visible transcript and opaque token only in memory. The server stores the token digest, six bounded turns and deterministic subject context with a thirty-minute idle expiry. The planner receives a bounded restored transcript.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#59626c"/></marker></defs>
  <style>.b{fill:#fff;stroke:#9aa4ad;stroke-width:2}.g{fill:#eaf7f1;stroke:#0f6b4f}.p{fill:#f2edfa;stroke:#6b4ca5}.l{stroke:#59626c;stroke-width:2;fill:none;marker-end:url(#a)}text{font:14px system-ui,sans-serif;fill:#0f1419}.s{font-size:12px;fill:#59626c}.h{font-weight:700}@media(prefers-color-scheme:dark){.b{fill:#131920}.g{fill:#12271f}.p{fill:#20192e}text{fill:#e6e9ec}.s{fill:#a7b0b9}}</style>
  <rect class="b" x="35" y="64" width="230" height="130" rx="10"/><text class="h" x="150" y="96" text-anchor="middle">Browser component memory</text><text class="s" x="150" y="126" text-anchor="middle">visible transcript</text><text class="s" x="150" y="149" text-anchor="middle">opaque 256-bit token</text><text class="s" x="150" y="172" text-anchor="middle">no localStorage or URL</text>
  <rect class="g" x="385" y="42" width="250" height="175" rx="10"/><text class="h" x="510" y="76" text-anchor="middle">Server thread registry</text><text class="s" x="510" y="107" text-anchor="middle">SHA-256 token digest only</text><text class="s" x="510" y="130" text-anchor="middle">6 turns, 32 KiB per thread</text><text class="s" x="510" y="153" text-anchor="middle">1,024 threads, 16 MiB total</text><text class="s" x="510" y="176" text-anchor="middle">30 minute idle expiry</text><text class="s" x="510" y="199" text-anchor="middle">subject context, 2 waiters</text>
  <rect class="p" x="755" y="64" width="210" height="130" rx="10"/><text class="h" x="860" y="96" text-anchor="middle">Planner request</text><text class="s" x="860" y="126" text-anchor="middle">bounded transcript</text><text class="s" x="860" y="149" text-anchor="middle">closed subject refs</text><text class="s" x="860" y="172" text-anchor="middle">no persistent profile</text>
  <path class="l" d="M265 129h120"/><path class="l" d="M635 129h120"/>
  <text class="s" x="500" y="275" text-anchor="middle">Restart, expiry, eviction or reset loses context safely. An unknown token never selects another thread.</text>
</svg>
