<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 390" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval funnel and failure controls</title>
  <desc id="desc">A question first passes deterministic subject resolution and time scope. Exact lookup or bounded discovery retrieves evidence, which is deduplicated and returned as typed rows. Failure classes are measured before optional generation.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#59626c"/></marker></defs>
  <style>.b{fill:#fff;stroke:#9aa4ad;stroke-width:2}.g{fill:#eaf7f1;stroke:#0f6b4f}.y{fill:#fff8df;stroke:#a87713}.r{fill:#fff0f2;stroke:#c6112f}.l{stroke:#59626c;stroke-width:2;fill:none;marker-end:url(#a)}text{font:14px system-ui,sans-serif;fill:#0f1419}.s{font-size:11.5px;fill:#59626c}.h{font-weight:700}@media(prefers-color-scheme:dark){.b{fill:#131920}.g{fill:#12271f}.y{fill:#2c2513}.r{fill:#30151b}text{fill:#e6e9ec}.s{fill:#a7b0b9}}</style>
  <rect class="b" x="20" y="60" width="135" height="74" rx="10"/><text class="h" x="88" y="91" text-anchor="middle">Question</text><text class="s" x="88" y="115" text-anchor="middle">date + article + intent</text>
  <rect class="g" x="195" y="60" width="160" height="74" rx="10"/><text class="h" x="275" y="91" text-anchor="middle">Subject preflight</text><text class="s" x="275" y="115" text-anchor="middle">one, several or none</text>
  <rect class="g" x="395" y="60" width="150" height="74" rx="10"/><text class="h" x="470" y="91" text-anchor="middle">Time + scope</text><text class="s" x="470" y="115" text-anchor="middle">closed intervals</text>
  <rect class="y" x="585" y="25" width="170" height="74" rx="10"/><text class="h" x="670" y="56" text-anchor="middle">Exact coordinate</text><text class="s" x="670" y="80" text-anchor="middle">top-1, no similarity</text>
  <rect class="y" x="585" y="125" width="170" height="92" rx="10"/><text class="h" x="670" y="155" text-anchor="middle">Bounded discovery</text><text class="s" x="670" y="179" text-anchor="middle">FTS default</text><text class="s" x="670" y="198" text-anchor="middle">metadata weak, hybrid gated</text>
  <rect class="g" x="795" y="75" width="160" height="92" rx="10"/><text class="h" x="875" y="106" text-anchor="middle">Result shaping</text><text class="s" x="875" y="130" text-anchor="middle">dedupe + fairness</text><text class="s" x="875" y="149" text-anchor="middle">bounded top-k</text>
  <rect class="g" x="995" y="75" width="145" height="92" rx="10"/><text class="h" x="1068" y="106" text-anchor="middle">Typed evidence</text><text class="s" x="1068" y="130" text-anchor="middle">rows + hashes</text><text class="s" x="1068" y="149" text-anchor="middle">permalinks + reasons</text>
  <path class="l" d="M155 97h40"/><path class="l" d="M355 97h40"/><path class="l" d="M545 97l40-35"/><path class="l" d="M545 97l40 74"/><path class="l" d="M755 62c35 0 20 59 40 59"/><path class="l" d="M755 171c35 0 20-50 40-50"/><path class="l" d="M955 121h40"/>
  <rect class="r" x="160" y="270" width="840" height="86" rx="10"/><text class="h" x="580" y="296" text-anchor="middle">Measured failure classes</text><text x="580" y="324" text-anchor="middle">not retrieved  |  wrong passage  |  buried evidence  |  right passage, wrong instrument  |  publisher gap</text><text class="s" x="580" y="345" text-anchor="middle">Generation cannot repair an identity or evidence failure it cannot see.</text>
</svg>
