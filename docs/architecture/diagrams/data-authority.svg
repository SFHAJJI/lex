<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Data authority and provenance chain</title>
  <desc id="desc">Official catalogue and files enter an append-only evidence repository. Deterministic profiles create article records. Official metadata enters a weaker discovery lane. A signed manifest binds the resulting index artifacts.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#59626c"/></marker></defs>
  <style>.b{fill:#fff;stroke:#9aa4ad;stroke-width:2}.d{fill:#fff8df;stroke:#a87713}.m{fill:#e9f1fb;stroke:#34699a}.s{fill:#eaf7f1;stroke:#0f6b4f}.l{stroke:#59626c;stroke-width:2;fill:none;marker-end:url(#a)}.weak{stroke:#34699a;stroke-dasharray:7 5;stroke-width:2;fill:none;marker-end:url(#a)}text{font:14px system-ui,sans-serif;fill:#0f1419}.small{font-size:12px;fill:#59626c}.h{font-weight:700}@media(prefers-color-scheme:dark){.b{fill:#131920}.d{fill:#2c2513}.m{fill:#142236}.s{fill:#12271f}text{fill:#e6e9ec}.small{fill:#a7b0b9}}</style>
  <rect class="b" x="25" y="72" width="150" height="72" rx="10"/><text class="h" x="100" y="102" text-anchor="middle">Official files</text><text class="small" x="100" y="126" text-anchor="middle">XML, XHTML, PDF</text>
  <rect class="b" x="25" y="242" width="150" height="72" rx="10"/><text class="h" x="100" y="272" text-anchor="middle">Official metadata</text><text class="small" x="100" y="296" text-anchor="middle">titles + taxonomies</text>
  <rect class="d" x="225" y="64" width="180" height="88" rx="10"/><text class="h" x="315" y="96" text-anchor="middle">Evidence repo</text><text class="small" x="315" y="120" text-anchor="middle">bytes + URL + observed</text><text class="small" x="315" y="138" text-anchor="middle">SHA-256 addressed</text>
  <rect class="d" x="465" y="64" width="180" height="88" rx="10"/><text class="h" x="555" y="96" text-anchor="middle">Profiles</text><text class="small" x="555" y="120" text-anchor="middle">immutable extraction</text><text class="small" x="555" y="138" text-anchor="middle">articles or typed gap</text>
  <rect class="m" x="465" y="234" width="180" height="88" rx="10"/><text class="h" x="555" y="266" text-anchor="middle">Discovery lane</text><text class="small" x="555" y="290" text-anchor="middle">scheme + concept URI</text><text class="small" x="555" y="308" text-anchor="middle">weak rank + reason</text>
  <rect class="s" x="705" y="130" width="180" height="100" rx="10"/><text class="h" x="795" y="163" text-anchor="middle">Index artifacts</text><text class="small" x="795" y="187" text-anchor="middle">time + FTS + vectors</text><text class="small" x="795" y="207" text-anchor="middle">source assertions retained</text>
  <rect class="s" x="945" y="130" width="130" height="100" rx="10"/><text class="h" x="1010" y="163" text-anchor="middle">Signature</text><text class="small" x="1010" y="187" text-anchor="middle">whole manifest</text><text class="small" x="1010" y="207" text-anchor="middle">external trust root</text>
  <path class="l" d="M175 108h50"/><path class="l" d="M405 108h60"/><path class="l" d="M645 108c40 0 28 72 60 72"/><path class="weak" d="M175 278h290"/><path class="weak" d="M645 278c40 0 28-98 60-98"/><path class="l" d="M885 180h60"/>
  <text class="small" x="550" y="370" text-anchor="middle">Taxonomy may help find a work. Only dated publisher text may support a legal claim.</text>
</svg>
