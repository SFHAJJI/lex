<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" role="img" aria-labelledby="title desc">
  <title id="title">Release, promotion and rollback state machine</title>
  <desc id="desc">A signed code and data image becomes a zero-traffic candidate. Separate smoke, retrieval, assistant, browser and human gates authorize promotion. Traffic moves only after evidence verification and exact former production remains as rollback.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#59626c"/></marker></defs>
  <style>.b{fill:#fff;stroke:#9aa4ad;stroke-width:2}.g{fill:#eaf7f1;stroke:#0f6b4f}.y{fill:#fff8df;stroke:#a87713}.p{fill:#f2edfa;stroke:#6b4ca5}.l{stroke:#59626c;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#c6112f;stroke-width:2;fill:none;marker-end:url(#a);stroke-dasharray:7 5}text{font:14px system-ui,sans-serif;fill:#0f1419}.s{font-size:11.5px;fill:#59626c}.h{font-weight:700}@media(prefers-color-scheme:dark){.b{fill:#131920}.g{fill:#12271f}.y{fill:#2c2513}.p{fill:#20192e}text{fill:#e6e9ec}.s{fill:#a7b0b9}}</style>
  <rect class="y" x="25" y="70" width="160" height="82" rx="10"/><text class="h" x="105" y="101" text-anchor="middle">Signed artifacts</text><text class="s" x="105" y="125" text-anchor="middle">code + indexes + model</text><text class="s" x="105" y="143" text-anchor="middle">one immutable image</text>
  <rect class="b" x="225" y="70" width="160" height="82" rx="10"/><text class="h" x="305" y="101" text-anchor="middle">Candidate</text><text class="s" x="305" y="125" text-anchor="middle">active, zero traffic</text><text class="s" x="305" y="143" text-anchor="middle">exact revision identity</text>
  <rect class="p" x="425" y="35" width="210" height="152" rx="10"/><text class="h" x="530" y="66" text-anchor="middle">Independent gates</text><text class="s" x="530" y="93" text-anchor="middle">readiness + MCP smoke</text><text class="s" x="530" y="115" text-anchor="middle">retrieval benchmark</text><text class="s" x="530" y="137" text-anchor="middle">assistant + browser eval</text><text class="s" x="530" y="159" text-anchor="middle">human review signature</text>
  <rect class="g" x="675" y="70" width="170" height="82" rx="10"/><text class="h" x="760" y="101" text-anchor="middle">Promote</text><text class="s" x="760" y="125" text-anchor="middle">reverify evidence</text><text class="s" x="760" y="143" text-anchor="middle">move traffic once</text>
  <rect class="g" x="885" y="35" width="240" height="152" rx="10"/><text class="h" x="1005" y="66" text-anchor="middle">Steady state</text><text class="s" x="1005" y="94" text-anchor="middle">new production: 100%</text><text class="s" x="1005" y="118" text-anchor="middle">former production: rollback</text><text class="s" x="1005" y="142" text-anchor="middle">maxInactiveRevisions = 1</text><text class="s" x="1005" y="166" text-anchor="middle">signed release-state receipt</text>
  <path class="l" d="M185 111h40"/><path class="l" d="M385 111h40"/><path class="l" d="M635 111h40"/><path class="l" d="M845 111h40"/>
  <path class="back" d="M1005 187v110H760v-145"/><text class="s" x="882" y="323" text-anchor="middle">receipt failure: restore exact former production</text>
  <rect class="y" x="85" y="258" width="460" height="92" rx="10"/><text class="h" x="315" y="288" text-anchor="middle">Shared ACR boundary</text><text class="s" x="315" y="313" text-anchor="middle">broad delete rejected under legacy RBAC</text><text class="s" x="315" y="334" text-anchor="middle">target: dedicated registry or audited repository-scoped ABAC</text>
</svg>
