<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Lex system context</title>
  <desc id="desc">Official Legilux and EUR-Lex sources flow through immutable evidence, deterministic derivation and a signed local index into one legal core used by the web workspace and public MCP server, with a contained target V3 agent that is not active.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#59626c"/></marker></defs>
  <style>.box{fill:#fff;stroke:#9aa4ad;stroke-width:2;rx:10}.data{fill:#fff8df;stroke:#a87713}.core{fill:#eaf7f1;stroke:#0f6b4f}.ai{fill:#f2edfa;stroke:#6b4ca5}.line{stroke:#59626c;stroke-width:2;fill:none;marker-end:url(#arrow)}text{font:15px system-ui,sans-serif;fill:#0f1419}.small{font-size:12px;fill:#59626c}.label{font-weight:700}@media(prefers-color-scheme:dark){.box{fill:#131920}.data{fill:#2c2513}.core{fill:#12271f}.ai{fill:#20192e}text{fill:#e6e9ec}.small{fill:#a7b0b9}}</style>
  <rect class="box" x="20" y="58" width="145" height="72"/><text class="label" x="92.5" y="87" text-anchor="middle">Legilux</text><text class="small" x="92.5" y="110" text-anchor="middle">official catalogue</text>
  <rect class="box" x="20" y="220" width="145" height="72"/><text class="label" x="92.5" y="249" text-anchor="middle">EUR-Lex</text><text class="small" x="92.5" y="272" text-anchor="middle">Cellar + EuroVoc</text>
  <rect class="data" x="215" y="134" width="155" height="92" rx="10"/><text class="label" x="292.5" y="166" text-anchor="middle">Evidence</text><text class="small" x="292.5" y="189" text-anchor="middle">verbatim bytes</text><text class="small" x="292.5" y="209" text-anchor="middle">source URI + SHA-256</text>
  <rect class="data" x="410" y="134" width="155" height="92" rx="10"/><text class="label" x="487.5" y="166" text-anchor="middle">Derivation</text><text class="small" x="487.5" y="189" text-anchor="middle">immutable profiles</text><text class="small" x="487.5" y="209" text-anchor="middle">articles + typed gaps</text>
  <rect class="data" x="605" y="134" width="155" height="92" rx="10"/><text class="label" x="682.5" y="166" text-anchor="middle">Signed index</text><text class="small" x="682.5" y="189" text-anchor="middle">time + FTS + vectors</text><text class="small" x="682.5" y="209" text-anchor="middle">verified manifest</text>
  <rect class="core" x="800" y="134" width="165" height="92" rx="10"/><text class="label" x="882.5" y="166" text-anchor="middle">Legal core</text><text class="small" x="882.5" y="189" text-anchor="middle">typed operations</text><text class="small" x="882.5" y="209" text-anchor="middle">closed outcomes</text>
  <g id="reader-channels">
    <rect class="box" x="1010" y="24" width="175" height="72"/><text class="label" x="1097.5" y="53" text-anchor="middle">Web workspace</text><text class="small" x="1097.5" y="76" text-anchor="middle">server-rendered + React</text>
    <rect class="ai" x="1010" y="134" width="175" height="92" rx="10"/><text class="label" x="1097.5" y="166" text-anchor="middle">Target V3 agent</text><text class="small" x="1097.5" y="189" text-anchor="middle">currently contained</text><text class="small" x="1097.5" y="209" text-anchor="middle">not a live capability</text>
    <rect class="box" x="1010" y="264" width="175" height="72"/><text class="label" x="1097.5" y="293" text-anchor="middle">Public MCP</text><text class="small" x="1097.5" y="316" text-anchor="middle">HTTP + stdio, read-only</text>
  </g>
  <path class="line" d="M165 94h30v61h20"/><path class="line" d="M165 256h30v-51h20"/><path class="line" d="M370 180h40"/><path class="line" d="M565 180h40"/><path class="line" d="M760 180h40"/>
  <path class="line" d="M965 180h24V60h21"/><path class="line" d="M965 180h45"/><path class="line" d="M965 180h24v120h21"/>
  <text class="small" x="600" y="362" text-anchor="middle">Retrieval and legal authority are deterministic; generation remains disabled pending V3 promotion.</text>
</svg>
